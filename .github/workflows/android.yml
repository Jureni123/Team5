name: TeamTalk5 Android Build (arm64-v8a Only + Cached NDK)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Set up Android NDK r29
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
      
      # ✅ PERBAIKAN: GANTI PATTERN HASH FILES AGAR TIDAK TIMEOUT
      # Scan hanya folder Build/ dan Library/ yang relevan dengan C++
      - name: Cache Native Builds (WebRTC & Install)
        uses: actions/cache@v4
        with:
          path: |
            ${{runner.workspace}}/webrtc
            ${{runner.workspace}}/install-android
          key: ${{ runner.os }}-native-r29-${{ hashFiles('Build/**', 'Library/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-native-r29-
            ${{ runner.os }}-native-
      
      - name: Install System Dependencies
        working-directory: ${{github.workspace}}/Build
        run: |
          export JAVA_HOME=${{ env.JAVA_HOME }}
          sudo make depend-ubuntu24-android || echo "Warning: Dependency install skipped/warned. Using pre-installed Java 17."
      
      # ✅ BUILD TEAMTALK LIBRARY (TIDAK DIUBAH)
      - name: Build TeamTalk Library (C++ ARM64 ONLY)
        working-directory: ${{github.workspace}}/Build
        run: |
          make CMAKE_EXTRA="-G Ninja -DWEBRTC_FETCH_PATH=${{runner.workspace}}/webrtc -DCMAKE_INSTALL_PREFIX=${{runner.workspace}}/install-android" \
               CMAKE_BUILD_EXTRA="--target install" android-arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
      
      - name: Generate Release Keystore
        working-directory: ${{github.workspace}}/Client/TeamTalkAndroid
        run: |
          keytool -genkeypair -v -keystore release-key.keystore \
            -alias teamtalk-release -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=TeamTalk, OU=Dev, O=TeamTalk, L=Jakarta, ST=DKI, C=ID"
          cat > keystore.properties <<EOF
          storeFile=release-key.keystore
          storePassword=android123
          keyAlias=teamtalk-release
          keyPassword=android123
          EOF
      
      # ✅ OPTIMASI GRADLE: HAPUS --no-daemon AGAR LEBIH CEPAT
      - name: Build arm64-v8a Release APK
        working-directory: ${{github.workspace}}/Client/TeamTalkAndroid
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: TeamTalk5-arm64-v8a-Release
          path: Client/TeamTalkAndroid/build/outputs/apk/release/*.apk
          if-no-files-found: error
