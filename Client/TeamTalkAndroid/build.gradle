plugins {
    alias(libs.plugins.android.application)
    // ✅ TAMBAHKAN PLUGIN GOOGLE SERVICES DI SINI
    id 'com.google.gms.google-services' version '4.4.0' apply false
}

def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) {
    ksFile.withInputStream { ks.load(it) }
}

android {
    namespace = 'dk.bearware.gui'
    compileSdk = 37 
    buildToolsVersion = '37.0.0'
    ndkVersion = '29.0.14206865'

    defaultConfig {
        applicationId = 'dk.bearware.gui'
        minSdk = 23
        targetSdk = 37
        versionCode = 150
        versionName = '5.22'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        
        // ⚠️ PENTING: JANGAN ADA abiFilters DI SINI KALAU PAKAI SPLITS
        // Biarkan splits yang mengatur arsitektur agar tidak bentrok
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile = rootProject.file(ks['storeFile'])
                storePassword = ks['storePassword']
                keyAlias = ks['keyAlias']
                keyPassword = ks['keyPassword']
                
                // ✅ METODE SIGNING TERBARU (V1, V2, V3, V4)
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = false // Set true kalau mau upload ke Play Store
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            if (ks['signDebug']?.toBoolean()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    androidResources {
        generateLocaleConfig = true
    }

    // ✅ HANYA INI YANG MENGATUR ARM64-V8A
    splits {
        abi {
            enable = true
            reset()
            include 'arm64-v8a'
            universalApk = false
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [layout.buildDirectory.dir('jniLibs-staging')]
        }
    }

    packaging {
        jniLibs {
            excludes += ['**/libTeamTalk5Pro-jni.so']
        }
        pickFirsts = [
                'META-INF/LICENSE.md',
                'META-INF/LICENSE-notice.md'
        ]
    }

    lint {
        disable 'MissingTranslation'
    }
}

tasks.register('syncJniLibs', Sync) {
    from('../../Library/TeamTalkJNI/libs') {
        include 'arm64-v8a/**'
    }
    into layout.buildDirectory.dir('jniLibs-staging')
}

afterEvaluate {
    tasks.named('preBuild').configure { dependsOn 'syncJniLibs' }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation libs.gson
    implementation libs.androidx.annotation
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.androidx.fragment
    implementation libs.androidx.media
    implementation libs.androidx.preference
    implementation libs.androidx.viewpager
    implementation libs.material
    
    // ✅ TAMBAHKAN DEPENDENCY FIREBASE DI SINI
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    
    implementation files('../../Library/TeamTalkJNI/libs/TeamTalk5.jar')

    testImplementation libs.junit.jupiter.api
    testImplementation files('../../Library/TeamTalkJNI/libs/TeamTalk5Test.jar')

    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.junit.jupiter.api
    androidTestImplementation files('../../Library/TeamTalkJNI/libs/TeamTalk5Test.jar')
}

// ✅ WAJIB ADA DI PALING BAWAH UNTUK AKTIFKAN GOOGLE SERVICES
apply plugin: 'com.google.gms.google-services'
